<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예시 화면 · RPG 스타일 · 스타트업 막내 개발자로 환생했습니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=DotGothic16&display=swap">
<style>
/* ===== design.md v0.5 · 10장 토큰 (UI는 블루 팔레트, 맵은 월드 팔레트) ===== */
:root {
  --ink:#070A1E; --night:#141B4D; --signal:#3F4ACB; --glow:#9AA6FF; --paper:#F0F2FF; --alert:#FF8F80;
  --r1:#0E1336; --r3:#2F3771; --r4:#434C8B; --r5:#5760A6; --r6:#6B75C1; --r7:#7F8ADB; --r9:#C5CCFF;
  --knowledge:var(--signal); --danger:var(--alert);
  --delta-good:var(--glow); --delta-bad:var(--alert); --focus:var(--glow);
  --text:var(--paper); --text-muted:rgb(240 242 255 / .7);

  --win-bg:linear-gradient(180deg, rgb(47 55 113 / .97) 0%, rgb(20 27 77 / .98) 45%, rgb(14 19 54 / .98) 100%);
  --win-border:2px solid var(--glow);
  --win-ring:0 0 0 2px var(--ink), 0 4px 0 2px rgb(7 10 30 / .35);
  --radius-win:6px;

  --font-dialog:"Nanum Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-sys:"DotGothic16", "Nanum Gothic", monospace;
  --fs-dialog:22px; --lh-dialog:36px;
  --fs-choice:18px; --lh-choice:28px;
  --fs-body:16px;   --lh-body:26px;
  --fs-small:14px;  --lh-small:22px;
  --fs-sys:20px; --fs-pop:22px;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --speed:1;
  --dur-fast:120ms; --dur-base:240ms; --dur-slow:480ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --face:144px; --dialog-max:1080px; --dialog-min-h:196px; --choice-w:400px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing:inherit; }
html { height:100%; color-scheme:dark; background:var(--ink); scroll-padding-top:env(safe-area-inset-top, 0px); }
body { margin:0; height:100%; overflow:hidden; background:var(--ink); color:var(--text); font:400 var(--fs-body)/var(--lh-body) var(--font-dialog); -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
[hidden] { display:none !important; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.outline { text-shadow:1px 0 var(--ink), -1px 0 var(--ink), 0 1px var(--ink), 0 -1px var(--ink), 1px 1px var(--ink), -1px -1px var(--ink), 1px -1px var(--ink), -1px 1px var(--ink); }

#world { position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

/* ===== 창 ===== */
.win { position:relative; background:var(--win-bg); border:var(--win-border); box-shadow:var(--win-ring); border-radius:var(--radius-win); }
.win::before {
  content:""; position:absolute; inset:2px; border-radius:3px; pointer-events:none;
  border:1px solid rgb(240 242 255 / .10);
  background:repeating-linear-gradient(0deg, rgb(240 242 255 / .025) 0 1px, transparent 1px 3px);
}
.win::after {
  content:""; position:absolute; inset:-2px; pointer-events:none; border-radius:var(--radius-win);
  background:
    linear-gradient(var(--paper),var(--paper)) left 3px top 3px / 2px 2px no-repeat,
    linear-gradient(var(--paper),var(--paper)) right 3px top 3px / 2px 2px no-repeat,
    linear-gradient(var(--paper),var(--paper)) left 3px bottom 3px / 2px 2px no-repeat,
    linear-gradient(var(--paper),var(--paper)) right 3px bottom 3px / 2px 2px no-repeat;
  opacity:.55;
}
.win > * { position:relative; z-index:1; }
.win.opening { animation:win-open calc(var(--dur-base) * var(--speed)) var(--ease-out) both; transform-origin:center bottom; }
@keyframes win-open { from { transform:scaleY(0); opacity:0; } to { transform:scaleY(1); opacity:1; } }

/* 상태 · 시스템 창 */
.hud { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); left:12px; width:calc(100% - 24px); display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-4); pointer-events:none; z-index:2; }
.hud > * { pointer-events:auto; }
.status { padding:8px 12px 9px; display:grid; gap:5px; width:216px; }
.stat { display:grid; grid-template-columns:64px 1fr 26px; align-items:center; gap:8px; --c:var(--glow); }
.stat[data-key="debt"] { --c:#C792EA; } .stat[data-key="stamina"] { --c:#7BD88F; }
.stat.salary { grid-template-columns:64px 1fr; }
.stat-name { display:flex; align-items:center; gap:4px; font-size:12px; font-weight:800; color:var(--paper); white-space:nowrap; }
.stat-name svg { width:14px; height:14px; flex:none; shape-rendering:crispEdges; }
.stat-val { font:16px/1 var(--font-sys); text-align:right; font-variant-numeric:tabular-nums; transition:color var(--dur-base); }
.bar { height:7px; background:var(--ink); border:1px solid var(--r4); position:relative; overflow:hidden; }
.bar::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 11px, rgb(7 10 30 / .5) 11px 12px); }
.bar-fill { display:block; height:100%; background:linear-gradient(180deg, rgb(255 255 255 / .55) 0 2px, transparent 2px), var(--c); transition:width calc(var(--dur-base) * 2 * var(--speed)) var(--ease-out); }
.stat.is-danger { --c:var(--alert); }
.stat.is-danger .stat-val { color:var(--alert); }
.system { padding:8px 12px 9px; display:grid; gap:6px; justify-items:end; }
.year { font:22px/1 var(--font-sys); }
.year small { font:800 12px/1 var(--font-dialog); color:var(--glow); margin-left:var(--space-1); }
.controls { display:grid; gap:5px; font-size:12px; font-weight:800; }
.ctl { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.ctl-label { color:var(--paper); }
.switch { width:28px; height:14px; background:var(--ink); border:2px solid var(--r4); position:relative; }
.switch::after { content:""; position:absolute; top:1px; left:1px; width:8px; height:8px; background:var(--r4); transition:transform var(--dur-fast); }
.switch[aria-checked="true"] { border-color:var(--glow); }
.switch[aria-checked="true"]::after { transform:translateX(14px); background:var(--glow); }
.seg { display:flex; gap:var(--space-1); }
.seg button { font:14px/1 var(--font-sys); padding:2px 5px; color:var(--r9); border:2px solid transparent; }
.seg button[aria-pressed="true"] { color:var(--paper); border-color:var(--glow); background:rgb(154 166 255 / .18); }

/* 아래 */
.bottom { position:fixed; left:0; right:0; z-index:2; bottom:calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); margin:0 auto; padding:0 var(--space-4); max-width:calc(var(--dialog-max) + var(--space-8)); display:flex; flex-direction:column; align-items:flex-end; gap:var(--space-3); }
.choice-win { width:min(var(--choice-w), 100%); padding:var(--space-2); overflow:hidden; }
.choice-win ul { list-style:none; margin:0; padding:0; display:grid; gap:2px; }
.choice { width:100%; display:flex; align-items:center; gap:var(--space-3); padding:var(--space-2) var(--space-3); font-size:var(--fs-choice); line-height:var(--lh-choice); font-weight:700; text-align:left; border:1px solid transparent; border-radius:3px; }
.choice .txt { flex:1; word-break:keep-all; }
.choice:hover, .choice:focus-visible { background:rgb(154 166 255 / .18); border-color:var(--glow); animation:cursor 1s steps(2) infinite; outline:none; }
@keyframes cursor { 50% { background:rgb(154 166 255 / .08); } }
.choice.down { background:linear-gradient(180deg, #5560E0, var(--knowledge) 40%, #343EB0); border-color:var(--knowledge); }
.choice.down:hover, .choice.down:focus-visible { border-color:var(--paper); animation:none; filter:brightness(1.12); }
.choice.down.enter { animation:rise calc(var(--dur-slow) * var(--speed)) var(--ease-out) both; animation-delay:calc(var(--dur-base) * var(--speed)); }
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.chip-concept { font-size:13px; font-weight:800; padding:1px var(--space-2); border:1px solid rgb(240 242 255 / .6); border-radius:999px; white-space:nowrap; text-shadow:none; }
kbd { display:inline-grid; place-items:center; flex:none; width:24px; height:24px; border:1px solid var(--glow); border-radius:3px; font:15px/1 var(--font-sys); color:var(--paper); background:rgb(7 10 30 / .5); text-shadow:none; transition:background-color var(--dur-fast), color var(--dur-fast); }
.choice.down kbd { border-color:rgb(240 242 255 / .7); background:rgb(7 10 30 / .25); }
kbd.pressed { background:var(--glow); color:var(--ink); }
.countdown { position:absolute; left:0; bottom:0; height:2px; width:100%; background:var(--glow); transform-origin:left; transform:scaleX(0); }

.dialog { width:100%; min-height:var(--dialog-min-h); padding:var(--space-6) var(--space-8) var(--space-8); display:flex; gap:var(--space-6); align-items:flex-start; cursor:pointer; }
.dialog.event { border-style:dashed; }
.namebox { position:absolute !important; left:var(--space-6); top:0; transform:translateY(-70%); padding:2px var(--space-4); font-size:var(--fs-small); font-weight:800; color:var(--glow); z-index:3 !important; }
.tag { position:absolute !important; right:var(--space-6); top:0; transform:translateY(-50%); padding:0 var(--space-3); font-size:13px; font-weight:800; color:var(--glow); background:var(--ink); border:1px solid var(--glow); border-radius:3px; z-index:3 !important; }
.face { width:var(--face); height:var(--face); flex:none; border:2px solid var(--r4); box-shadow:0 0 0 2px var(--ink); background:var(--r1); }
.face svg { display:block; width:100%; height:100%; }
.msg { flex:1; min-width:0; display:grid; gap:var(--space-3); padding-top:var(--space-1); }
.msg-text { margin:0; font-size:var(--fs-dialog); line-height:var(--lh-dialog); font-weight:700; word-break:keep-all; white-space:pre-wrap; min-height:calc(var(--lh-dialog) * 2); }
.msg-text.bad { color:var(--alert); }
.cause { margin:0; padding-left:var(--space-3); border-left:2px dashed var(--glow); font-size:var(--fs-small); font-weight:800; color:var(--glow); }
.cause code { font:13px var(--font-sys); color:var(--r6); margin-left:var(--space-2); text-shadow:none; }
.chips { display:flex; flex-wrap:wrap; gap:var(--space-2); }
.chip { font:16px/1 var(--font-sys); padding:4px var(--space-2); border:1px solid currentColor; border-radius:3px; background:rgb(7 10 30 / .5); }
.chip.good { color:var(--delta-good); } .chip.bad { color:var(--delta-bad); } .chip.none { color:var(--text-muted); }
.explain { margin:0; display:flex; gap:var(--space-3); font-size:var(--fs-body); line-height:var(--lh-body); padding-top:var(--space-3); border-top:1px solid rgb(154 166 255 / .25); word-break:keep-all; }
.explain b { color:var(--glow); flex:none; }
.reveal { animation:fade calc(var(--dur-base) * var(--speed)) var(--ease-out) both; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.pause { position:absolute !important; left:50%; bottom:6px; transform:translateX(-50%); font:14px/1 var(--font-sys); color:var(--glow); animation:blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
.auto-tag { position:absolute !important; right:var(--space-6); bottom:8px; font-size:13px; color:var(--text-muted); font-weight:700; }

.pop { position:fixed; z-index:5; transform:translate(-50%, 0); font:var(--fs-pop)/1 var(--font-sys); white-space:nowrap; pointer-events:none; animation:pop calc(900ms * var(--speed)) var(--ease-out) forwards; }
.pop.good { color:var(--delta-good); } .pop.bad { color:var(--delta-bad); }
@keyframes pop { 0% { opacity:0; transform:translate(-50%, 8px); } 20% { opacity:1; transform:translate(-50%, -6px); } 70% { opacity:1; transform:translate(-50%, -18px); } 100% { opacity:0; transform:translate(-50%, -26px); } }
.flash { position:fixed; inset:0; background:var(--alert); opacity:0; pointer-events:none; z-index:6; }
.flash.go { animation:flash calc(var(--dur-slow) * var(--speed)) ease-out; }
@keyframes flash { 0% { opacity:0; } 25% { opacity:.2; } 100% { opacity:0; } }
.note { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--dialog-min-h) + 40px); z-index:1; margin:0; font-size:12px; color:var(--text-muted); font-weight:700; pointer-events:none; opacity:0; }

@media (max-width:1023px) {
  .hud { flex-direction:column; } .status { width:216px; } .system { justify-items:start; width:100%; } .ctl { justify-content:flex-start; }
}
@media (max-width:719px) {
  .face { display:none; } .dialog { padding:var(--space-6) var(--space-4) var(--space-8); }
  :root { --fs-dialog:18px; --lh-dialog:30px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition-property:opacity !important; } }
</style>
</head>

    <div class="stat" data-key="trust" role="meter" aria-label="신뢰" aria-valuemin="0" aria-valuemax="100"><span class="stat-name"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h8v6h-1v2h-1v1h-1v1h-2v-1h-1v-1h-1v-2h-1z" fill="#2B1D14"/><path d="M3 2h6v5h-1v1h-1v1h-2v-1h-1v-1h-1z" fill="#9AA6FF"/><path d="M4 3h2v4h-2z" fill="#C5CCFF"/></svg>신뢰</span><span class="bar"><span class="bar-fill"></span></span><span class="stat-val"></span></div>

    <div class="stat" data-key="stamina" role="meter" aria-label="체력" aria-valuemin="0" aria-valuemax="100"><span class="stat-name"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2v-1h3v1h1v3h-1v1h-1v1h-1v1h-1v1h-2v-1h-1v-1h-1v-1h-1v-1h-1v-3h1z" fill="#2B1D14"/><path d="M2 3h3v1h2v-1h3v3h-1v1h-1v1h-1v1h-2v-1h-1v-1h-1v-1h-1z" fill="#7BD88F"/><path d="M3 4h1v1h-1z" fill="#D4F5DC"/></svg>체력</span><span class="bar"><span class="bar-fill"></span></span><span class="stat-val"></span></div>
  </section>
  <section class="win system outline" aria-label="연차와 속도 조절">
    <div class="year">3 / 30<small>년차</small></div>
    <div class="controls">
      <div class="ctl"><span class="ctl-label">평범한 해 자동 넘김</span><button class="switch" role="switch" aria-checked="false" aria-label="평범한 해 자동 넘김" id="sw-skip"></button></div>
      <div class="ctl"><span class="ctl-label">배속</span><span class="seg" id="speed" role="group" aria-label="배속"><button aria-pressed="true" data-speed="1">1×</button><button aria-pressed="false" data-speed="0.5">2×</button><button aria-pressed="false" data-speed="0.25">4×</button></span></div>
      <div class="ctl"><span class="ctl-label">자동 결정</span><button class="switch" role="switch" aria-checked="false" aria-label="자동 결정" id="sw-auto"></button></div>
    </div>
  </section>
</div>

    <ul>
      <li><button class="choice" data-pick="left"><kbd data-key="ArrowLeft">←</kbd><span class="txt">월요일 오전에 배포</span></button></li>

  function updateNPCs(dt) {

      const dx = tx - n.x, dy = ty - n.y, dist = Math.hypot(dx, dy);
      if (dist < 1) {
        n.x = tx; n.y = ty; n.moving = false;
        if (face) n.dir = face;
        if (pause) n.wait = pause; else n.i = (n.i + 1) % n.path.length;
        return;
      }
      const stepLen = Math.min(dist, NPC_SPEED * dt);
      n.x += dx / dist * stepLen; n.y += dy / dist * stepLen;
      n.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');

  const OPTIONS = {
    left: { text: '주말 동안 결제 오류 문의 47건.', bad: false, cause: false, flash: false, effects: { trust: -5 }, keep: ['stamina'],
      explain: '배포를 미뤄도 이미 난 버그는 그대로 남습니다. 미루는 것보다 문제가 생겼을 때 되돌릴 수단이 먼저입니다.' },
    right: { text: '22:40 결제 실패율 18%.\n주말 내내 장애 대응.', bad: true, cause: true, flash: true, effects: { stamina: -30, trust: -10 }, keep: [],
      explain: '금요일이라서 위험한 게 아니라, 문제가 생겼을 때 되돌릴 수단이 없어서 위험합니다.' },
    down: { text: '오류를 10분 만에 발견하고 플래그를 껐다.', bad: false, cause: false, flash: false, effects: { trust: 5, debt: 1 }, keep: [],
      explain: '기능 플래그는 배포와 출시를 나눕니다. 문제가 생기면 다시 배포하지 않고 끄기만 하면 됩니다.' }
  };

  const dialog = $('#dialog'), textEl = $('#text'), pause = $('#pause'), choicesEl = $('#choices');
  let phase = 'typing', typeTimer = null, full = '', onDone = null, firstChoices = true;

  function type(str, done) {
    clearTimeout(typeTimer);
    full = str; onDone = done; textEl.textContent = ''; pause.hidden = true;
    if (reduce) return finishType();
    let i = 0;
    const step = () => {
      i++; textEl.textContent = full.slice(0, i);
      if (i >= full.length) return finishType();
      typeTimer = setTimeout(step, (/[.,?\n]/.test(full[i - 1]) ? 6 : 1) * 28 * speed());
    };
    typeTimer = setTimeout(step, 200 * speed());
  }
  function finishType() { clearTimeout(typeTimer); textEl.textContent = full; pause.hidden = false; const cb = onDone; onDone = null; if (cb) cb(); }
  function openWin(el) { el.hidden = false; el.classList.remove('opening'); void el.offsetWidth; el.classList.add('opening'); }
  function reveal(el) { el.hidden = false; el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal'); }

  function intro() {
    phase = 'typing';
    state.talking = true; state.outage = false;
    if (reduce) render(performance.now());
    $('#namebox').textContent = 'CTO';
    $('#face').hidden = false;
    ['#cause', '#chips', '#explain', '#auto-tag'].forEach(s => $(s).hidden = true);
    textEl.classList.remove('bad');
    openWin(dialog);
    type(INTRO, () => {
      $('#live').textContent = 'CTO: ' + INTRO.replace('\n', ' ') + ' 선택지: 왼쪽 월요일 오전에 배포, 오른쪽 지금 배포, 아래 기능 플래그로 결제 1%에만 켜고 배포';
      phase = 'choose'; pause.hidden = true;
      if (!firstChoices) choicesEl.querySelector('.down').classList.remove('enter');
      firstChoices = false;
      openWin(choicesEl);
      startAuto();
    });
  }

  let autoTimer = null;
  function startAuto() {
    stopAuto();
    if ($('#sw-auto').getAttribute('aria-checked') !== 'true' || phase !== 'choose') return;
    const cd = $('#countdown'), ms = 5000 * speed();
    cd.style.transition = 'none'; cd.style.transform = 'scaleX(1)'; void cd.offsetWidth;
    cd.style.transition = `transform ${ms}ms linear`; cd.style.transform = 'scaleX(0)';
    autoTimer = setTimeout(() => pick('left', true), ms);
  }
  function stopAuto() { clearTimeout(autoTimer); autoTimer = null; const cd = $('#countdown'); cd.style.transition = 'none'; cd.style.transform = 'scaleX(0)'; }

  function pick(side, auto = false) {
    if (phase !== 'choose') return;
    phase = 'result'; stopAuto();
    const o = OPTIONS[side];
    choicesEl.hidden = true;
    state.talking = false;
    if (o.flash) { state.outage = true; const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; if (!reduce) fl.classList.add('go'); }
    if (reduce) render(performance.now());
    const [sx, sy] = playerScreen();
    const entries = Object.entries(o.effects);
    entries.forEach(([k, d], i) => {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'pop outline ' + (isGood(k, d) ? 'good' : 'bad');
        el.textContent = `${isGood(k, d) ? '▲' : '▼'} ${NAMES[k]} ${sign(d)}`;
        el.style.left = sx + 'px'; el.style.top = (sy - 30 - i * 26) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000 * speed());
      }, i * 120 * speed());
      g[k] += d;
    });
    renderStats();
    $('#namebox').textContent = '결과';
    $('#face').hidden = true;
    if (o.cause) reveal($('#cause')); else $('#cause').hidden = true;
    textEl.classList.toggle('bad', o.bad);
    $('#chips').hidden = true; $('#explain').hidden = true;
    $('#auto-tag').hidden = !auto;
    openWin(dialog);
    type(o.text, () => {
      const chips = $('#chips'); chips.innerHTML = ''; const lines = [];
      entries.forEach(([k, d]) => { const c = document.createElement('span'); c.className = 'chip ' + (isGood(k, d) ? 'good' : 'bad'); c.textContent = `${isGood(k, d) ? '▲' : '▼'} ${NAMES[k]} ${sign(d)}`; chips.appendChild(c); lines.push(`${NAMES[k]} ${sign(d)}`); });
      o.keep.forEach(k => { const c = document.createElement('span'); c.className = 'chip none'; c.textContent = `– ${NAMES[k]} 유지`; chips.appendChild(c); lines.push(`${NAMES[k]} 유지`); });
      reveal(chips);
      $('#explain-text').textContent = o.explain; reveal($('#explain'));
      $('#live').textContent = (o.cause ? '1년차 테스트는 나중에에서 이어짐. ' : '') + o.text.replace('\n', ' ') + ' ' + lines.join(', ') + '. 해설: ' + o.explain;
      phase = 'resultDone';
    });
  }
  function nextYear() { g = { ...START }; renderStats(); intro(); }
  function advance() { if (phase === 'typing' || phase === 'result') finishType(); else if (phase === 'resultDone') nextYear(); }

  function pressKey(key) { const k = document.querySelector(`kbd[data-key="${key}"]`); if (!k) return; k.classList.add('pressed'); setTimeout(() => k.classList.remove('pressed'), 80); }
  document.addEventListener('keydown', e => {
    if (autoTimer && e.key !== 'Tab') stopAuto();
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down' };
    if (map[e.key]) { e.preventDefault(); if (phase === 'choose') { pressKey(e.key); pick(map[e.key]); } else if (phase === 'typing' || phase === 'result') finishType(); return; }
    if (e.key === 'Enter' || e.key === ' ') { const a = document.activeElement; if (a && a.tagName === 'BUTTON' && !a.closest('#dialog')) return; e.preventDefault(); advance(); }
    if (e.key === 'Escape') stopAuto();
  });
  dialog.addEventListener('click', advance);
  document.querySelectorAll('[data-pick]').forEach(btn => btn.addEventListener('click', () => pick(btn.dataset.pick)));
  document.querySelectorAll('.switch').forEach(s => s.addEventListener('click', () => {
    s.setAttribute('aria-checked', s.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    if (s.id === 'sw-auto') (s.getAttribute('aria-checked') === 'true' ? startAuto() : stopAuto());
  }));
  document.querySelectorAll('#speed button').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'));
    document.documentElement.style.setProperty('--speed', btn.dataset.speed);
    if (autoTimer) startAuto();
  }));
  document.addEventListener('pointerdown', e => { if (autoTimer && !e.target.closest('#sw-auto, #speed, [data-pick]')) stopAuto(); });

  /* ============ 시작 ============ */
  buildMap(); renderStats();
  for (let i = 0; i < 30; i++) { const m = spawnMote(); m.life = ri(m.max); motes.push(m); }
  addEventListener('resize', resize); resize();
  if (!reduce) { let last = 0, prev = performance.now(); const loop = now => { if (now - last > 33) { updateNPCs(Math.min(100, now - prev)); prev = now; last = now; render(now); } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  intro();
})();
</script>

</body>
</html>
